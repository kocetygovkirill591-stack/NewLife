name: Build Новая жизнь

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP-файл не найден"
            exit 1
          fi

          echo "Найден ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q NovayaZhizn_GitHub_AutoBuild_v1.2.zip -d extracted

          echo "Распаковка завершена"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          set -e

          PROJECT_DIR=$(dirname "$(find extracted -name gradlew -type f | head -n 1)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Android-проект не найден"
            exit 1
          fi

          echo "Android-проект найден: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovayaZhizn-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: NovayaZhizn-AAB
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
