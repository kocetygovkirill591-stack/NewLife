name: Новая Жизнь — Android Debug APK

"on":
  push:
    branches:
      - godot-v0.3.3-source-build
    paths:
      - ".github/workflows/godot-android.yml"
      - ".github/source/**"
      - "godot-project/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-android:
    name: Decode source, validate Godot and export APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout Godot source branch
        uses: actions/checkout@v4
        with:
          ref: godot-v0.3.3-source-build
          lfs: true

      - name: Restore Godot source and verify project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/godot-project"
          SOURCE_B64="$GITHUB_WORKSPACE/.github/source/main.gd.gz.b64"
          test -s "$PROJECT_DIR/project.godot" || { echo "::error::Не найден godot-project/project.godot"; exit 1; }
          test -s "$SOURCE_B64" || { echo "::error::Не найден сжатый GDScript .github/source/main.gd.gz.b64"; exit 1; }

          mkdir -p "$PROJECT_DIR/scripts"
          base64 --decode "$SOURCE_B64" | gzip --decompress --stdout > "$PROJECT_DIR/scripts/main.gd"
          test -s "$PROJECT_DIR/scripts/main.gd"
          grep -q '^extends Control' "$PROJECT_DIR/scripts/main.gd"
          grep -q '^func _ready' "$PROJECT_DIR/scripts/main.gd"
          echo "Restored main.gd: $(wc -c < "$PROJECT_DIR/scripts/main.gd") bytes"

          for required in \
            "scripts/main.gd" \
            "scenes/Main.tscn" \
            "assets/city_map.svg" \
            "assets/apartment.svg" \
            "export_presets.cfg"; do
            test -s "$PROJECT_DIR/$required" || { echo "::error::В Godot-проекте отсутствует $required"; exit 1; }
          done
          grep -q 'name="Android Debug"' "$PROJECT_DIR/export_presets.cfg" || { echo "::error::Не найден preset Android Debug"; exit 1; }
          grep -q 'res://assets/city_map.svg' "$PROJECT_DIR/scripts/main.gd" || { echo "::error::Скрипт не ссылается на SVG-карту"; exit 1; }
          grep -q 'res://assets/apartment.svg' "$PROJECT_DIR/scripts/main.gd" || { echo "::error::Скрипт не ссылается на SVG-квартиру"; exit 1; }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot source restored from repository text files."

      - name: Prepare Godot 4.3 Android environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config" "$HOME/.local/share/godot/export_templates"
          if [ "$HOME" != "/root" ]; then
            if [ -d /root/.config/godot ]; then
              mkdir -p "$HOME/.config/godot"
              cp -a /root/.config/godot/. "$HOME/.config/godot/"
            fi
            if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
              mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
              cp -a /root/.local/share/godot/export_templates/4.3.stable/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
            fi
          fi

          GODOT_VERSION="$(godot --version)"
          echo "Godot: $GODOT_VERSION"
          case "$GODOT_VERSION" in
            4.3*) ;;
            *) echo "::error::Ожидался Godot 4.3, получен $GODOT_VERSION"; exit 1 ;;
          esac

          java -version
          test -f /root/debug.keystore || { echo "::error::В контейнере отсутствует debug.keystore"; exit 1; }
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

          # Godot stores Android SDK/JDK locations in per-user EditorSettings,
          # not in the project. The CI container HOME is /github/home, so write
          # an explicit settings file there instead of relying on /root defaults.
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export ANDROID_HOME="/usr/lib/android-sdk"
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          fi
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<'SETTINGS'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"
          echo "Godot EditorSettings and Android templates are configured."

      - name: Import resources and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/godot-import.log"
          godot --headless --path "$PROJECT_DIR" --editor --quit --verbose 2>&1 | tee "$LOG"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script' "$LOG"; then
            echo "::error::Godot сообщил об ошибке GDScript или загрузки скрипта."
            exit 1
          fi

      - name: Run a short headless startup test
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/godot-smoke-test.log"
          godot --headless --path "$PROJECT_DIR" --quit-after 3 --verbose 2>&1 | tee "$LOG"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script' "$LOG"; then
            echo "::error::Главная сцена выдала ошибку при запуске."
            exit 1
          fi

      - name: Export Android Debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/android"
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/root/debug.keystore \
          GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey \
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android \
            godot --headless --path "$PROJECT_DIR" --export-debug --verbose "Android Debug" "$GITHUB_WORKSPACE/build/android/NewLife-V0.3.3-debug.apk"
          test -s "$GITHUB_WORKSPACE/build/android/NewLife-V0.3.3-debug.apk"
          unzip -t "$GITHUB_WORKSPACE/build/android/NewLife-V0.3.3-debug.apk" >/dev/null
          ls -lh "$GITHUB_WORKSPACE/build/android/NewLife-V0.3.3-debug.apk"

      - name: Package editable Godot source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/source"
          cd "$GITHUB_WORKSPACE"
          zip -qr "$GITHUB_WORKSPACE/build/source/NewLife-Godot-Source-V0.3.3.zip" godot-project
          unzip -t "$GITHUB_WORKSPACE/build/source/NewLife-Godot-Source-V0.3.3.zip" >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewLife-Android-Debug-APK-V0.3.3
          path: build/android/NewLife-V0.3.3-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload editable Godot source artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewLife-Godot-Source-V0.3.3
          path: build/source/NewLife-Godot-Source-V0.3.3.zip
          if-no-files-found: error
          retention-days: 14
